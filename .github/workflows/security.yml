name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (C/C++)
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
              libglm-dev \
            libssl-dev \
            zlib1g-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libunicorn-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libx11-dev
          sudo apt-get install -y libstorm-dev || true

      - name: Build SDL3 from source
        run: |
          # Ubuntu 24.04 has no libsdl3-dev: SDL3 landed in 25.04. Built here
          # the way StormLib already is, rather than pinning the job to a
          # newer runner image for one package.
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.24 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL3/build --parallel "$(nproc)"
          sudo cmake --install /tmp/SDL3/build
          sudo ldconfig


      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel $(nproc)

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      - name: Run Semgrep (security + secrets)
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --exclude extern \
            --error

  sanitizer-build:
    name: Sanitizer Build (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            build-essential \
            pkg-config \
              libglm-dev \
            libssl-dev \
            zlib1g-dev \
            libvulkan-dev \
            vulkan-tools \
            glslc \
            libavformat-dev \
            libavcodec-dev \
            libswscale-dev \
            libavutil-dev \
            libunicorn-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libx11-dev
          sudo apt-get install -y libstorm-dev || true

      - name: Build SDL3 from source
        run: |
          # Ubuntu 24.04 has no libsdl3-dev: SDL3 landed in 25.04. Built here
          # the way StormLib already is, rather than pinning the job to a
          # newer runner image for one package.
          set -euo pipefail
          git clone --depth 1 --branch release-3.2.24 \
            https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
          cmake --build /tmp/SDL3/build --parallel "$(nproc)"
          sudo cmake --install /tmp/SDL3/build
          sudo ldconfig


      - name: Configure (ASan/UBSan)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DWOWEE_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run tests (if present)
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          if [ -f build/CTestTestfile.cmake ] || [ -d build/tests ]; then
            ctest --test-dir build --output-on-failure
          else
            echo "No tests configured; sanitizer build completed."
          fi
